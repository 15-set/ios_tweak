<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insulation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f2f2f7;color:#1c1c1e;padding:16px;max-width:600px;margin:0 auto}
.title{font-size:22px;font-weight:bold;margin-bottom:8px}
.sub{color:#6e6e73;margin-bottom:20px}
.block{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
h3{font-size:17px;margin-bottom:10px;color:#1c1c1e}
ul{padding-left:20px}
li{margin-bottom:6px;color:#424245}
</style>
</head>
<body>
<div class="title">Insulation</div>
<div class="sub">温控调节插件</div>

<div class="block">
  <h3>版本 0.0.20</h3>
  <ul>
    <li>修复面板CPU模式空白问题</li>
    <li>新增【充电时启用原生温控】开关</li>
    <li>充电时交还系统温控，拔电自动恢复自定义设置</li>
    <li>适配iOS15，优化稳定性</li>
  </ul>
</div>

<div class="block">
  <h3>插件说明</h3>
  <ul>
    <li>解除苹果系统默认CPU温控，减少高温降频、游戏掉帧</li>
    <li>充电自动切回原生温控保护电池，拔电自动恢复</li>
    <li>基于开源项目二次维护，轻量无多余功能</li>
  </ul>
</div>

</body>
</html>
