name: build-insulation

on:
  push:
  workflow_dispatch:

env:
  THEOS: /home/runner/theos

jobs:
  build:
    # 锁定 ubuntu-24.04, 不用 ubuntu-latest:
    # 2026-11 起 latest 已切到 26.04 "resolute", 其仓库无 ldid 包
    # (实测日志: "E: Unable to locate package ldid"), 且新 glibc 环境
    # 可能给 theos/ldid 引入额外风险。24.04 仓库含 ldid 与 libplist-utils。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # rootless: palera1n/Dopamine, iOS 15+, 产物 arch=iphoneos-arm64, 安装前缀 /var/jb
        # rootful : 传统越狱, iOS 12.2~14, 产物 arch=iphoneos-arm
        scheme: [rootless, rootful]
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装构建依赖（不含 ldid, 单独处理）
        run: |
          set -e
          # Azure apt 源偶发 403/Hash Sum mismatch 是 Actions 高频瞬态失败, update 加重试
          for i in 1 2 3; do
            sudo apt-get update -y && break
            echo "apt-get update 第 $i 次失败, 10s 后重试"; sleep 10
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git make perl clang dpkg fakeroot \
            libplist-utils libssl-dev zlib1g-dev zstd curl unzip ca-certificates
          # libplist-utils 提供 plistutil: theos 需要它把旧式 ASCII 格式的
          # insulation.plist (Substrate filter) 转成二进制 plist, 缺它会打包失败

      - name: 安装 ldid（release 单文件优先, 源码编译兜底; 不依赖 apt）
        run: |
          set -e
          # 注: Ubuntu 24.04/26.04 仓库均无 ldid 包 (两次运行日志均证实), 放弃 apt 途径。
          # 资产名已经 GitHub API 实测: v2.1.5-procursus7 的 ldid_linux_x86_64 为单文件二进制。
          LDID_URL="https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64"
          echo "== 方案1: 预编译单文件 =="
          echo "URL: $LDID_URL"
          code=$(curl -sSL -w "%{http_code}" --retry 3 -o /tmp/ldid "$LDID_URL" || echo "curl_exit_$?")
          echo "HTTP=$code size=$(stat -c%s /tmp/ldid 2>/dev/null || echo 0) bytes"
          file /tmp/ldid || true
          if [ "$code" = "200" ] && file /tmp/ldid | grep -q ELF; then
            sudo install -m 0755 /tmp/ldid /usr/local/bin/ldid
            ldd /usr/local/bin/ldid || true
          else
            echo "方案1失败, 转方案2"
          fi
          if ! command -v ldid >/dev/null 2>&1; then
            echo "== 方案2: 源码编译 (ProcursusTeam/ldid, 仓库根为 Makefile) =="
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              g++ make libssl-dev libplist-dev
            git clone --depth 1 https://github.com/ProcursusTeam/ldid /tmp/ldid-src
            make -C /tmp/ldid-src -j"$(nproc)"
            sudo install -m 0755 /tmp/ldid-src/ldid /usr/local/bin/ldid
          fi
          hash -r
          command -v ldid || { echo "FATAL: ldid 两种方案均失败"; exit 1; }
          echo "== ldid 自检 =="
          command -v ldid
          ldid 2>&1 | head -2 || true   # ldid 无参数打印 usage 并返回非零, 属正常

      - name: 环境预检
        run: |
          echo "== os =="; . /etc/os-release; echo "$PRETTY_NAME"
          echo "== ldid =="; command -v ldid
          echo "== plistutil =="; command -v plistutil
          echo "== clang =="; clang --version | head -1
          echo "== THEOS =="; echo "$THEOS"; [ -d "$THEOS" ] && echo "(已存在)" || echo "(尚未安装, 预期)"

      - name: 安装 theos（官方安装脚本, 自动递归子模块 logos/libsubstrate 等）
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: 安装 iOS SDK（theos/sdks; clone 失败自动降级 tarball）
        run: |
          set -e
          # theos/sdks 仓库极大(含多个解压后的 SDK), git smart-http 大仓库 clone
          # 常见 "RPC failed / early EOF"; 加大 buffer, 失败则降级 codeload tarball
          git config --global http.postBuffer 524288000
          ok=0
          for i in 1 2; do
            echo "== 尝试 git clone (第 $i 次) =="
            if git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"; then ok=1; break; fi
            rm -rf "$THEOS/sdks"; sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "== 降级: codeload tarball =="
            curl -fsSL --retry 3 -o /tmp/sdks.tar.gz \
              https://codeload.github.com/theos/sdks/tar.gz/refs/heads/master
            echo "tarball size: $(stat -c%s /tmp/sdks.tar.gz) bytes"
            tar -xzf /tmp/sdks.tar.gz -C "$THEOS"
            mv "$THEOS/sdks-master" "$THEOS/sdks"
          fi
          echo "== 已安装 SDK =="
          ls "$THEOS/sdks" | tee /dev/stderr
          ls -d "$THEOS"/sdks/iPhoneOS*.sdk >/dev/null || { echo "FATAL: 无 iPhoneOS SDK"; exit 1; }

      - name: 编译
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          # theos 只有 rootless/roothide 两个显式 scheme; rootful = 不设置该变量。
          # 直接传 THEOS_PACKAGE_SCHEME=rootful 会被 common.mk 判为非法 scheme 而 Stop。
          if [ "$SCHEME" != "rootful" ]; then export THEOS_PACKAGE_SCHEME="$SCHEME"; fi
          echo "scheme_env=[${THEOS_PACKAGE_SCHEME:-<unset, rootful default>}]"
          echo "== 实际编译器 =="
          if [ -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -2
          else
            clang --version | head -1
          fi
          echo "ARCHS=arm64 (见 Makefile: theos Linux 工具链 clang-11 的 arm64e 为旧 ABI, 已收敛)"
          make clean
          make -j"$(nproc)"

      - name: 打包并校验
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          if [ "$SCHEME" != "rootful" ]; then export THEOS_PACKAGE_SCHEME="$SCHEME"; fi
          echo "scheme_env=[${THEOS_PACKAGE_SCHEME:-<unset, rootful default>}]"
          make package FINALPACKAGE=1
          deb=$(ls -t packages/*.deb | head -1)
          echo "产物: $deb ($(du -h "$deb" | cut -f1))"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"

      - name: 校验产物（切片数 / rootless 路径 / Info.plist）
        run: |
          set -e
          deb=$(ls -t packages/*.deb | head -1)
          rm -rf /tmp/chk && mkdir -p /tmp/chk
          dpkg-deb -x "$deb" /tmp/chk
          bundle=$(find /tmp/chk -type d -name "InsulationPrefs.bundle" | head -1)
          exe="$bundle/InsulationPrefs"
          dylib=$(find /tmp/chk -name "insulation.dylib" | head -1)
          echo "== 布局 =="; echo "bundle=$bundle"; echo "dylib=$dylib"
          for f in "$exe" "$dylib"; do
            [ -f "$f" ] || { echo "FATAL: 缺少 $f"; exit 1; }
            echo "== $f =="; file "$f"
            # 回归护栏: clang-11 产出的 arm64e 是旧 ABI, 在 iOS 14+ 的 arm64e 设备上会把
            # Settings 装载面板时打崩; 两个二进制都只允许 arm64 单切片
            if file "$f" | grep -q "arm64e"; then
              echo "FATAL: $f 含 arm64e 切片(clang-11 旧 ABI)"; exit 1
            fi
          done
          echo "== 动态依赖 =="
          grep -a -o "@rpath/[A-Za-z0-9_.]*" "$exe" | sort -u || true
          echo "== Info.plist =="
          python3 -c "import plistlib,sys; d=plistlib.load(open(sys.argv[1],'rb')); print({k:d.get(k) for k in ('CFBundleIdentifier','CFBundleExecutable','CFBundlePackageType','NSPrincipalClass')})" "$bundle/Info.plist"
          test -f "$bundle/Root.plist" || { echo "FATAL: bundle 缺 Root.plist"; exit 1; }

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: insulation-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
