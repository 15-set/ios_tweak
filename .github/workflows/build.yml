name: build-insulation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # [BUILD-FIX-H] 改用 macOS runner 构建:
    #   arm64e 的 ABI v2(ptrauth, cpusubtype 带 0x80000000 标记)只有 Apple 下游 clang 能产出。
    #   实测证据: Ubuntu clang 16.0.6 + `-target arm64e-apple-ios15.0` 仍产出 v1
    #   (cpusubtype=0x00000002, file 输出 "arm64e 00"), 自检步骤已拦下;
    #   theos 源码本身也把非 macOS 平台的 IS_NEW_ABI 强制为 0
    #   (makefiles/instance/rules.mk L124-131: "On non macOS, always use old ABI as only
    #   macOS can compile with new ABI"), 即 Linux 上连 libroot stub 都会链接 v1 版本。
    #   → 放弃 Linux 路径, 回到 macOS + Xcode 自带 Apple clang。
    #
    #   macOS 上不需要 theos/sdks: theos 会把 Xcode 的 iPhoneOS SDK 目录加入候选
    #   (makefiles/targets/_common/darwin_head.mk L107-112), TARGET 的 `latest` 段
    #   会解析到 Xcode 里版本最高的 iPhoneOS*.sdk; IS_NEW_ABI 由 clang 版本自动判定为 1
    #   (同文件 rules.mk L125-137), 因此不再需要 IS_NEW_ABI=1 覆盖。
    # [RUNNER-FIX] macos-14 在本仓库会被解析成 arm64 机型(macos-14-arm64-us-default),
    #   当前账号不支持 → run 直接 Cancelled(2s, "configuration is not supported")。
    #   固定显式 Intel 机型 (macos-15-intel)：arm64e 由 Apple clang 交叉编译产出, 与宿主架构无关。
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        # rootless: palera1n/Dopamine, iOS 15+, 产物 arch=iphoneos-arm64, 安装前缀 /var/jb
        # rootful : 传统越狱, iOS 12.2~14, 产物 arch=iphoneos-arm
        scheme: [rootless, rootful]
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备环境变量与工具链预检（Xcode / clang / ld）
        run: |
          set -e
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "== xcode-select =="; xcode-select -p
          echo "== xcodebuild =="; xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          echo "SDK 版本: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "== Apple clang =="; "$(xcrun --sdk iphoneos -f clang)" --version | head -3
          echo "== ld =="; ld -v 2>&1 | head -2
          echo "== lipo =="; xcrun -f lipo
          echo "== python3 =="; python3 --version

      - name: 安装依赖（由 Homebrew 提供 ldid / xz / dpkg）
        run: |
          set -e
          # ldid : 签名(theos 在 macOS 上 TARGET_CODESIGN=ldid, TARGET_CODESIGN_FLAGS ?= -S)
          # xz   : theos 自带 bin/dm.pl 用 lzma 压缩 deb
          # dpkg : 仅供校验阶段用 dpkg-deb -I/-c/-x 检查产物, 不参与打包(打包仍走 dm.pl)
          brew install ldid xz dpkg || brew upgrade ldid xz dpkg || true
          command -v ldid; ldid 2>&1 | head -2 || true
          command -v xz
          command -v dpkg-deb

      - name: 安装 theos（git clone --recursive, 不拉 theos/sdks）
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "== theos 目录 =="; ls "$THEOS"
          if [ -e "$THEOS/bin/dm.pl" ]; then echo "dm.pl 就位"; else echo "WARN: 缺 dm.pl, 打包可能失败"; fi
          # theos 在 macOS 上使用:
          #   TARGET_CC  = $(xcrun -sdk iphoneos -f clang)   (Apple clang, >=12)
          #   TARGET_LD  = $(xcrun -sdk iphoneos -f clang)   (由 clang 驱动调用 ld64)
          #   TARGET_LIPO= $(xcrun -f lipo)                  → 按 arch 递归编译后 lipo 合并成 fat
          #   TARGET_CODESIGN = ldid                          (brew 提供)

      - name: 自检 Apple clang 产 arm64e ABI v2
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun -sdk iphoneos -f clang)
          echo "SDK=$SDK"; echo "CC=$CC"
          echo "== clang --version =="; "$CC" --version
          echo "== ld 版本 =="; ld -v 2>&1 | head -3 || true
          echo "== theos libroot =="; ls "$THEOS/lib" | grep -E 'libroot' || true
          echo "== IS_NEW_ABI 预期 =="; echo "1 (macOS + Apple clang>=12 → 链接 \$THEOS/lib/libroot.a 的 v2 stub)"
          printf 'int probe_x;\n' > "$RUNNER_TEMP/probe.c"
          for arch in arm64 arm64e; do
            "$CC" -target "$arch-apple-ios15.0" -isysroot "$SDK" \
              -c "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe-$arch.o"
            echo "== probe $arch =="; file "$RUNNER_TEMP/probe-$arch.o"
            file "$RUNNER_TEMP/probe-$arch.o" | grep -q Mach-O || { echo "FATAL: $arch probe 非 Mach-O"; exit 1; }
          done
          xcrun lipo -info "$RUNNER_TEMP/probe-arm64e.o"
          # 结构化校验: v2 = cpusubtype 带 0x80000000 标记 且 minos>=14.0
          python3 - "$RUNNER_TEMP/probe-arm64e.o" <<'PY'
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          sub = struct.unpack('<I', d[8:12])[0]
          ncmds = struct.unpack('<I', d[16:20])[0]
          o, minos = 32, None
          for _ in range(ncmds):
              cmd, csz = struct.unpack('<II', d[o:o+8])
              if cmd == 0x32: minos = struct.unpack('<I', d[o+12:o+16])[0]
              elif cmd == 0x25: minos = struct.unpack('<I', d[o+8:o+12])[0]
              if csz < 8: break
              o += csz
          print('arm64e cpusubtype=0x%08x minos=%s' % (sub, '%d.%d' % ((minos or 0) >> 16, ((minos or 0) >> 8) & 0xff)))
          if not (sub & 0x80000000):
              raise SystemExit('FATAL: probe arm64e 是旧 ABI(v1), 本机 clang 不是 Apple clang')
          if minos is None or minos < (14 << 16):
              raise SystemExit('FATAL: probe arm64e minos<14.0')
          PY

      - name: 编译
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -o pipefail
          # theos 只有 rootless/roothide 两个显式 scheme; rootful = 不设置该变量。
          # 直接传 THEOS_PACKAGE_SCHEME=rootful 会被 common.mk 判为非法 scheme 而 Stop。
          if [ "$SCHEME" != "rootful" ]; then export THEOS_PACKAGE_SCHEME="$SCHEME"; fi
          echo "scheme_env=[${THEOS_PACKAGE_SCHEME:-<unset, rootful default>}]"
          echo "== 编译器 =="; "$(xcrun -sdk iphoneos -f clang)" --version | head -3
          echo "== 链接器 ld =="; ld -v 2>&1 | head -2 || true
          echo "ARCHS 预期: rootless/roothide=arm64 arm64e, rootful=arm64 (见 Makefile)"
          make clean
          set +e
          make -j"$(sysctl -n hw.ncpu)" 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            echo "::error::编译失败 rc=$rc"
            grep -E "error:|fatal error|Error [0-9]+|Undefined symbol|ld: " "$RUNNER_TEMP/build.log" | tail -n 15 | sed 's/%/%25/g' | sed 's/^/::error::build| /'
            tail -n 15 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | sed 's/^/::error::tail| /'
            exit 1
          fi
          echo "== 构建里出现的 -target =="
          grep -o -E -- '-target [a-z0-9]+-apple-ios[0-9.]+' "$RUNNER_TEMP/build.log" | sort -u || true
          # 注意: 不能用 `grep -c -- '-arch arm64e' build.log` 判断 ARCHS。
          # theos 的 make 只回显 `==> Compiling Tweak.x (arm64e)` 这类标签, 不回显完整编译命令行,
          # 该计数恒为 0 → 必然误报(上一版就因此把成功的 rootless 构建判成失败)。
          # 双切片由后面「校验产物」的 lipo 断言保证, 这里不再做任何基于日志文本的 ARCHS 判断。
          if grep -q 'incompatible arm64e ABI' "$RUNNER_TEMP/build.log"; then
            echo "FATAL: 链接器报告 arm64e ABI 不兼容(工具链/libroot stub 不一致)"; exit 1
          fi

      - name: 打包
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -e
          if [ "$SCHEME" != "rootful" ]; then export THEOS_PACKAGE_SCHEME="$SCHEME"; fi
          echo "scheme_env=[${THEOS_PACKAGE_SCHEME:-<unset, rootful default>}]"

          # [CASE-FIX] macOS 文件系统大小写不敏感:
          #   仓库根的发布元数据文件 Packages(大写 P) 与 theos 输出目录 packages/ 同名冲突
          #   → legacy.mk "mv debs packages" 报 "Not a directory", dm.pl 写 deb 也失败。
          #   debs/ 会触发 legacy.mk 的 debs→packages 迁移, 构建过程并不需要它。
          #   两者都只是 Sileo 源发布物, 编译打包不需要 → 先移出工作区。
          if [ -e ./Packages ]; then
            mv ./Packages "$RUNNER_TEMP/Packages.repo-meta"; echo "已移开根目录 Packages(发布元数据)"
          fi
          rm -rf ./debs ./packages
          echo "清理完成: 当前根目录无 packages/debs 残留"
          if [ -e "$THEOS/bin/dm.pl" ]; then
            echo "dm.pl: 在位"
          else
            echo "::error::dm.pl 缺失, theos 打包脚本不在 $THEOS/bin"
            ls "$THEOS/bin" 2>&1 | sed 's/^/::error::bin| /' | head -n 6
          fi
          command -v dpkg-deb >/dev/null || echo "::error::dpkg-deb 不在 PATH"

          set +e
          make package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/pkg.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "== make package rc=$rc =="
          echo "== pkg.log 最后 30 行 =="
          tail -n 30 "$RUNNER_TEMP/pkg.log" | sed 's/\r$//' || true
          echo "== staging 目录 =="
          du -sh .theos/_ 2>/dev/null || true
          ls .theos/_ 2>/dev/null | head -20 || true

          # 校验 theos/dm.pl 的产物: 只要 deb 缺失或不是合法 Debian 包, 就改用 dpkg-deb 重新打包
          deb=$(ls -t packages/*.deb 2>/dev/null | head -1)
          if [ -n "$deb" ] && dpkg-deb -I "$deb" >/dev/null 2>&1; then
            echo "theos 打包产物有效: $deb"
          else
            echo "::warning::theos 打包未产出合法 deb(rc=$rc), 回退 dpkg-deb 直接打包 .theos/_"
            if [ -d .theos/_ ]; then
              echo "== staging 内容(前 30) =="
              find .theos/_ -maxdepth 3 | head -30
              mkdir -p packages
              rm -f packages/*.deb
              set +e
              dpkg-deb --root-owner-group -Zxz --build .theos/_ "packages/insulation_${SCHEME}.deb" 2>&1 | tail -n 15
              set -e
            else
              echo "::error::.theos/_ 不存在, 无法回退打包(说明 staging 阶段就失败了)"
              exit 1
            fi
            deb=$(ls -t packages/*.deb 2>/dev/null | head -1)
            if [ -z "$deb" ]; then echo "::error::回退打包后仍没有 deb"; exit 1; fi
            dpkg-deb -I "$deb" >/dev/null 2>&1 || { echo "::error::回退产物仍不是合法 deb"; exit 1; }
          fi

          echo "产物: $deb ($(du -h "$deb" | cut -f1))"
          dpkg-deb -I "$deb" || true
          dpkg-deb -c "$deb" | head -60 || true

      - name: 校验产物（arm64+arm64e 双切片 / ABI v2 / rootless 路径 / Info.plist）
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -e
          LIPO=$(xcrun -f lipo)
          deb=$(ls -t packages/*.deb | head -1)
          rm -rf "$RUNNER_TEMP/chk" && mkdir -p "$RUNNER_TEMP/chk"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/chk"
          bundle=$(find "$RUNNER_TEMP/chk" -type d -name "InsulationPrefs.bundle" | head -1)
          exe="$bundle/InsulationPrefs"
          dylib=$(find "$RUNNER_TEMP/chk" -name "insulation.dylib" | head -1)
          echo "== 布局 =="; echo "bundle=$bundle"; echo "dylib=$dylib"
          # 断言方向: 目标进程(Preferences / thermalmonitord)都是 arm64e, 镜像必须含 arm64e 切片;
          # 纯 arm64 会被 dlopen_preflight 拒绝("have 'arm64', need 'arm64e'")。
          # rootful 例外: 部署 12.2<14.0, clang>=12 产不出 arm64e(v1), 要求 arm64 单切片。
          if [ "$SCHEME" = "rootful" ]; then wanted="arm64"; else wanted="arm64 arm64e"; fi
          echo "== 期望切片: $wanted =="
          for f in "$exe" "$dylib"; do
            [ -f "$f" ] || { echo "FATAL: 缺少 $f"; exit 1; }
            echo "== $f =="; file "$f"
            info=$("$LIPO" -info "$f"); echo "$info"
            for a in $wanted; do
              echo "$info" | grep -qw "$a" || { echo "FATAL: $f 缺少 $a 切片"; exit 1; }
            done
          done
          # arm64e 必须 iOS14+ ABI v2: cpusubtype 带 0x80000000 标记 + minos>=14.0
          if [ "$SCHEME" != "rootful" ]; then
          python3 - "$exe" "$dylib" <<'PY'
          import struct, sys
          def slices(p):
              d = open(p,'rb').read()
              if d[:4] == b'\xca\xfe\xba\xbe':   # fat 头 (大端)
                  n = struct.unpack('>I', d[4:8])[0]
                  out = []
                  for i in range(n):
                      cpu, sub, off, sz, al = struct.unpack('>iiIII', d[8+20*i:8+20*i+20])
                      out.append((cpu, sub & 0xFFFFFFFF, off))
                  return out
              return [(struct.unpack('<i', d[4:8])[0], struct.unpack('<I', d[8:12])[0], 0)]
          def abi_at(p, base):
              d = open(p,'rb').read()
              sub = struct.unpack('<I', d[base+8:base+12])[0]
              ncmds = struct.unpack('<I', d[base+16:base+20])[0]
              o, minos = base + 32, None
              for _ in range(ncmds):
                  cmd, csz = struct.unpack('<II', d[o:o+8])
                  if cmd == 0x32: minos = struct.unpack('<I', d[o+12:o+16])[0]
                  elif cmd == 0x25: minos = struct.unpack('<I', d[o+8:o+12])[0]
                  if csz < 8: break
                  o += csz
              return sub, minos
          ok = True
          for p in sys.argv[1:]:
              print(p)
              sl = slices(p)
              print('  切片表: ' + ', '.join('cpu=0x%08x sub=0x%08x' % (c, s) for c, s, o in sl))
              # lipo 写 fat_arch 的 cpusubtype 可能是 0x2 (纯 arch) 也可能已带 0x80000000 标记,
              # 统一按低字节==2 认作 arm64e, 真正的 ABI 版本以切片内层 Mach-O 头为准。
              cand = [o for c, s, o in sl if c == 0x0100000C and (s & 0xFF) == 2]
              if not cand:
                  print('  FATAL: 没有 arm64e 切片'); ok = False; continue
              sub, minos = abi_at(p, cand[0])
              print('  arm64e cpusubtype=0x%08x minos=%d.%d' % (sub, (minos or 0) >> 16, ((minos or 0) >> 8) & 0xff))
              if not (sub & 0x80000000):
                  print('  FATAL: 旧 ABI(v1), iOS14+ 会拒绝/崩溃'); ok = False
              if minos is None or minos < (14 << 16):
                  print('  FATAL: minos < 14.0'); ok = False
          sys.exit(0 if ok else 1)
          PY
          fi
          # 依赖检查: Xcode SDK 不带 Preferences.tbd, 子工程已改 -Wl,-undefined,dynamic_lookup,
          # 因此 bundle 不应再有 Preferences 的 LC_LOAD_DYLIB, 也不得出现 Xcode 绝对路径。
          echo "== otool -L =="
          XCODE_PREFIX=$(xcode-select -p)
          for f in "$exe" "$dylib"; do
            echo "== $f =="
            otool -L "$f" | tail -n +2 | sed 's/^[[:space:]]*//' | sort -u
            if otool -L "$f" | grep -q -e "$XCODE_PREFIX" -e "/Applications/Xcode"; then
              echo "FATAL: $f 的依赖里含 Xcode 绝对路径"; exit 1
            fi
            if otool -L "$f" | grep -q 'PrivateFrameworks/Preferences.framework'; then
              echo "FATAL: $f 仍强链 Preferences.framework(应走 dynamic_lookup)"; exit 1
            fi
          done
          echo "== 动态依赖 =="
          strings "$exe" | grep -o "@rpath/[A-Za-z0-9_.]*" | sort -u || true
          echo "== Info.plist =="
          python3 -c "import plistlib,sys; d=plistlib.load(open(sys.argv[1],'rb')); print({k:d.get(k) for k in ('CFBundleIdentifier','CFBundleExecutable','CFBundlePackageType','NSPrincipalClass')})" "$bundle/Info.plist"
          test -f "$bundle/Root.plist" || { echo "FATAL: bundle 缺 Root.plist"; exit 1; }

          # 内嵌 ChargeLimiter.app 校验: 必须随包安装 + 主程序与 daemon 具备可执行位
          capp=$(find "$RUNNER_TEMP/chk" -type d -name "ChargeLimiter.app" | head -1)
          [ -n "$capp" ] || { echo "FATAL: deb 里没有 ChargeLimiter.app"; exit 1; }
          echo "== ChargeLimiter.app =="; echo "$capp"
          ls -l "$capp" | head -20
          test -x "$capp/ChargeLimiter" || { echo "FATAL: ChargeLimiter 缺可执行位"; exit 1; }
          test -x "$capp/ChargeLimiterDaemon" || { echo "FATAL: ChargeLimiterDaemon 缺可执行位"; exit 1; }
          python3 -c "import plistlib,sys; d=plistlib.load(open(sys.argv[1],'rb')); print({'CFBundleIdentifier':d.get('CFBundleIdentifier'),'CFBundleExecutable':d.get('CFBundleExecutable'),'CFBundleURLTypes':d.get('CFBundleURLTypes')})" "$capp/Info.plist"
          python3 -c "import plistlib,sys; d=plistlib.load(open(sys.argv[1],'rb')); ids=[i.get('CFBundleIdentifier') for i in d.get('items',[]) if i.get('cell')=='PSButtonCell']; print('面板按钮 action:',[i.get('action') for i in d.get('items',[]) if i.get('cell')=='PSButtonCell'])" "$bundle/Root.plist"

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: insulation-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error

      # 把 deb 发布到独立分支, 便于用 raw.githubusercontent.com 匿名下载(artifact 下载需登录)
      - name: 发布 deb 到 artifacts 分支
        if: github.event_name == 'push'
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -e
          deb=$(ls -t packages/*.deb | head -1)
          name=$(basename "$deb")
          echo "发布 $name 到分支 artifacts-$SCHEME"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "artifacts-$SCHEME"
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f "$deb"
          git commit -m "build: $name"
          git push -f origin "HEAD:artifacts-$SCHEME"
